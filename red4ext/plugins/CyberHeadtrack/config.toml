# cyber-headtrack tracking config
# [on_foot] applies while walking; [vehicle] while seated in any car or bike.
# lean_* moves the camera with your head position; it starts off in vehicles.
# ads_eye: -1 left, 0 centre, 1 right.
# [gaze] moves the scanner reticle to where you look in scan mode (Tab) and scans the target
# under it. sticky_lock keeps that target while you look away from it (e.g. at the quickhack
# list); lock_radius is a fraction of the screen height.
# [tobii] fallback_url is opened when Stream Engine finds no tracker (Wine/Proton with
# tobii-linux serving the PRP pipe); "" turns it off.

[on_foot]
smoothing_min_cutoff_hz = 1
smoothing_beta = 0.1
max_yaw_deg = 45
max_pitch_deg = 45
max_roll_deg = 45
yaw_scale = 1
pitch_scale = 1
roll_scale = 1
invert_yaw = false
invert_pitch = false
invert_roll = false
lean_enabled = true
lean_smoothing_min_cutoff_hz = 0.5
lean_smoothing_beta = 0.05
lean_scale = 1
max_lean_side_cm = 20
max_lean_up_cm = 10
max_lean_forward_cm = 15
invert_lean_side = false
invert_lean_up = false
ads_tracking_off = false
ads_ease_seconds = 0.25
ads_eye = 1
ads_eye_offset_cm = 3.2
invert_lean_forward = false

[vehicle]
smoothing_min_cutoff_hz = 1
smoothing_beta = 0.1
max_yaw_deg = 45
max_pitch_deg = 45
max_roll_deg = 45
yaw_scale = 1
pitch_scale = 1
roll_scale = 1
invert_yaw = false
invert_pitch = false
invert_roll = false
lean_enabled = false
lean_smoothing_min_cutoff_hz = 0.5
lean_smoothing_beta = 0.05
lean_scale = 1
max_lean_side_cm = 20
max_lean_up_cm = 10
max_lean_forward_cm = 15
invert_lean_side = false
invert_lean_up = false
ads_tracking_off = false
ads_ease_seconds = 0.25
ads_eye = 1
ads_eye_offset_cm = 3.2
invert_lean_forward = false

[gaze]
scan_enabled = true
smoothing_min_cutoff_hz = 0.5
smoothing_beta = 1
sticky_lock = true
lock_radius = 0.06
switch_dwell_seconds = 0.2

[tobii]
fallback_url = "tobii-prp://ET5-LINUX"
