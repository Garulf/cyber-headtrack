repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: readwright-check
        name: README is up to date (readwright check)
        entry: readwright check
        language: system
        pass_filenames: false
        files: ^(README\.md|README\.md\.j2|readme\.yaml)$

      - id: portable-tests
        name: portable unit tests (ctest)
        entry: bash -c 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug >/dev/null && cmake --build build >/dev/null && ctest --test-dir build --output-on-failure'
        language: system
        stages: [pre-push]
        pass_filenames: false
